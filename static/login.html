<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · MathInteract</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header id="site-header" data-page="login"></header>
  <main class="container">
    <div class="form-card">
      <form id="login-form" novalidate>
        <h1>Welcome back</h1>
        <p class="lead">Log in to join the discussion.</p>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
        <p class="form-error" role="alert"></p>
        <p class="form-foot">New here? <a href="/signup.html" data-keep-next>Create an account</a></p>
        <p class="form-help">Forgot your password? Ask an admin to reset it.</p>
      </form>
    </div>
  </main>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
