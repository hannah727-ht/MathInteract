<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account · MathInteract</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header id="site-header" data-page="account"></header>
  <main class="container">
    <div class="form-card">
      <form id="password-form" novalidate>
        <h1>Your account</h1>
        <p class="lead">Logged in as <strong id="account-name"></strong>.</p>
        <h2 class="form-section">Change password</h2>
        <div class="field">
          <label for="current-password">Current password</label>
          <input id="current-password" name="current_password" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="new-password">New password</label>
          <input id="new-password" name="new_password" type="password" autocomplete="new-password" required minlength="8">
          <span class="hint">At least 8 characters.</span>
        </div>
        <div class="field">
          <label for="new-password2">Confirm new password</label>
          <input id="new-password2" name="new_password2" type="password" autocomplete="new-password" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Change password</button>
        <p class="form-error" role="alert"></p>
        <p class="form-note" role="status"></p>
      </form>
    </div>
  </main>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
